[package]
name = "sim"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib: WASM として出力する / rlib: ネイティブでテストするため
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[features]
# 知覚と脳の判断を rayon で並列に計算する（ネイティブの画面なし実行・テスト用）。
# ブラウザ（WASM）はスレッドが使えないので有効にしない。並列でも順番でも結果は同じ
parallel = ["dep:rayon"]
# 1 tick の段ごとの時間を測る（ネイティブの画面なし実行用。WASM では使えない）
profile = []

[dependencies]
rayon = { version = "1.10", optional = true }
